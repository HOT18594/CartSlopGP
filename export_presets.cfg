[preset.3]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="version.txt,CHANGELOG.md,*.glb,assets/ui/art/*.png"
; Do NOT try to strip the *.import sidecars here: measured on the 0.8.7 Web
; export, 4194 *.import files (794 KB, 0.6 % of the pack) are pulled in as
; dependencies of the imported resources and an *.import exclude filter does
; not remove them (Godot 4.7.2 packs dependencies regardless of the filter).
; The generated version.json stamp is added after the export by
; pi_setup/sync_web_release.ps1, so it is not filtered here either.
exclude_filter="docs/*,tools/*,_removed_previews/*,_backup_setup6/*,_verify/*"
export_path="../builds/v0.8.7/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.3.options]

variant/thread_support=false
variant/extensions_support=false
; Web texture policy: WebGL2 covers ETC2/EAC on desktop AND mobile browsers,
; while S3TC/BPTC is desktop-only (a phone GPU gets no compressed texture and
; blows up VRAM). ETC2-only keeps the pack the same size as the old S3TC-only
; export (same 4x4 block layout) while making the build universally compressed.
; Enable vram_texture_compression/for_desktop as well only if a device class
; needs S3TC quality. Rationale in _audit/reports/ws1-web.md.
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=true
html/canvas_resize_policy=1
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
; The export is single-threaded (variant/thread_support=false), so the game
; does not need SharedArrayBuffer. Do not require COOP/COEP: the Cloudflare
; package documents the conditional headers for a future threaded build.
progressive_web_app/ensure_cross_origin_isolation_headers=false
